# Requires the compose Postgres + Redis to be running: docker compose up -d
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/example_test}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.jpa.hibernate.ddl-auto=create-drop

spring.data.redis.host=localhost
spring.data.redis.port=${REDIS_PORT:6380}

app.jwt.secret=test-secret-key-long-enough-for-hs256-abc
app.jwt.ttl-minutes=15
app.jwt.refresh-ttl-days=30
app.rate-limit.login=5
app.rate-limit.register=5
