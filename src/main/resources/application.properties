spring.config.import=optional:file:.env[.properties]

spring.application.name=example

# The dev Postgres is started automatically from compose.yaml; start_only keeps it up after the app stops.
spring.docker.compose.lifecycle-management=start_only

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/example}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Swagger UI: turn it off in production with SWAGGER_UI=false in the env.
springdoc.swagger-ui.enabled=${SWAGGER_UI:true}
springdoc.api-docs.enabled=${SWAGGER_UI:true}

# Required (at least 32 bytes) via .env or an env variable. The app fails to start when empty.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:15}
app.jwt.refresh-ttl-days=${REFRESH_TTL_DAYS:30}

# Attempts per minute, per username for login and per IP for register.
app.rate-limit.login=${LOGIN_RATE_LIMIT:5}
app.rate-limit.register=${REGISTER_RATE_LIMIT:5}

# Observability: one OTLP endpoint, the Alloy collector fans out to Loki and Tempo.
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
# Default is 0.1. Full sampling belongs to development only, hence the env variable.
management.tracing.sampling.probability=${TRACE_SAMPLING:1.0}
logging.structured.format.console=${LOG_FORMAT:ecs}

management.endpoints.web.exposure.include=health,info,metrics

# Out of scope (logs + traces only); without this the OTLP registry retries every minute
# against a collector route that does not exist and floods Loki with WARN.
management.otlp.metrics.export.enabled=false

# Noise control: Spring Security emits a span per filter chain / authorization check, which buries
# the spans that matter. DB observations stay on, they are the ones worth seeing.
management.observations.enable.spring.security=false

# Connection + query spans are the useful ones; fetch/result-set spans trebles span count
# for no insight at this size.
jdbc.includes=connection,query
